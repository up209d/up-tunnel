# uptunnel nginx configuration.
#
# Replace example.com throughout, then:
#   sudo cp uptunnel.conf /etc/nginx/sites-available/uptunnel
#   sudo ln -s /etc/nginx/sites-available/uptunnel /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# You need a wildcard certificate for *.tun.example.com. Let's Encrypt only issues
# wildcards over DNS-01, so http-01/webroot will not work:
#   sudo certbot certonly --manual --preferred-challenges dns \
#        -d tun.example.com -d '*.tun.example.com' -d tunnel.example.com
# (Use a DNS plugin such as certbot-dns-route53 if you want unattended renewal.)

# Passes Upgrade through for WebSockets and leaves it as "close" otherwise. The "close"
# is important: it stops nginx pooling upstream connections, which is what lets the
# tunnel server assume one upstream connection carries exactly one Host header.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- control plane: where agents connect ------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tunnel.example.com;

    ssl_certificate     /etc/letsencrypt/live/tun.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tun.example.com/privkey.pem;

    location /control {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Agent sessions are long-lived; without this nginx kills idle tunnels hourly.
        proxy_read_timeout  7d;
        proxy_send_timeout  7d;
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8081/healthz;
    }

    location / {
        return 404;
    }
}

# ---- data plane: every HTTP tunnel -----------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.tun.example.com;

    ssl_certificate     /etc/letsencrypt/live/tun.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tun.example.com/privkey.pem;

    # Let tunnelled apps decide their own limits rather than imposing nginx's.
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # $host must survive: the tunnel server routes on it.
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # Buffering off in both directions keeps SSE and streaming responses live.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout  7d;
        proxy_send_timeout  7d;
    }
}

# ---- redirect plain HTTP ----------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name tunnel.example.com *.tun.example.com;
    return 301 https://$host$request_uri;
}
