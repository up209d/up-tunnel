[project]
name = "uptunnel"
version = "0.1.0"
description = "Agent for a self-hosted tunnel: exposes local HTTP and TCP services through your own server"
requires-python = ">=3.9"
dependencies = ["websockets>=13.0"]

[project.optional-dependencies]
# Only needed if you keep your config in YAML rather than JSON.
yaml = ["pyyaml>=6.0"]

[project.scripts]
uptunnel = "uptunnel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["uptunnel"]
