# Copy to up.yaml next to where you run the agent, or pass --config.
# A .json file with the same keys works too, and needs no PyYAML.

server: wss://tunnel.example.com/control
token: replace-with-the-secret-from-the-server
name: macbook          # label shown in server logs; defaults to the hostname

tunnels:
  - name: web
    kind: http
    subdomain: mac      # served at https://mac.tun.example.com
    target: 3000        # local port, or host:port
    rewrite_host: true  # Vite/webpack reject an unfamiliar Host header

  - name: ssh
    kind: tcp
    remote_port: 20022  # omit to let the server pick from its range
    target: 22

  - name: mqtt
    kind: tcp
    remote_port: 20083
    target: 127.0.0.1:1883
